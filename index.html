<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BillEvents — Unforgettable moments, one place.</title>
    <meta name="description" content="Discover concerts, festivals, shows, exhibitions and experiences happening around you." />

    <!-- Apply saved theme before first paint (prevents flash) -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('billevents-theme');
          if (saved === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@500,700,900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
